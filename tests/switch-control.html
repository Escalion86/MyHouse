<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Проверка управления выключателем</title><div id="root"></div>
<script type="module">
import React,{useState} from 'react';import{createRoot}from'react-dom/client';
import SwitchControl from '/src/SwitchControl.jsx';import{getSwitchStates,getSwitchCommand}from'/src/ha/switchStates.js';import'/src/style.css';
const h=React.createElement,device={id:'qa',channels:[{id:'hall',label:'Свет в коридоре · 1 этаж'},{id:'outdoor',label:'Свет на улице'}]},mappings={'qa:hall':['light.hall'],'qa:outdoor':['switch.outdoor']};
