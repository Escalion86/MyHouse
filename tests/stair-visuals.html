<!doctype html><meta charset="utf-8"><title>Проверка каркаса лестницы</title>
<style>body{margin:0}nav{position:fixed;top:12px;left:12px}button{padding:12px;margin:4px}</style>
<nav><button id="above">Сверху вниз</button><button id="front">Со стороны подступенков</button><button id="below">Снизу</button><button id="house">В доме</button><button id="turn">Поворот</button></nav>
<script type="module">
import * as T from 'three';
import {buildHouse} from '/src/model/buildHouse.js';
import {STAIR,LEVEL,mirrorX} from '/src/model/layout.js';
const scene=new T.Scene();scene.background=new T.Color('#cccac0');
const model=buildHouse(scene);model.applyView(0,'walk');
scene.background=new T.Color('#cccac0');
for(const child of model.root.children)child.visible=child.name==='Лестница';
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.02,100);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
scene.add(new T.HemisphereLight('#ffffff','#b3b9a8',2.6));
const light=new T.DirectionalLight('#fff6e5',3.1);light.position.set(-10,22,-6);light.castShadow=true;
light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-25,right:25,top:25,bottom:-25});
light.shadow.normalBias=.025;light.shadow.bias=-.0003;scene.add(light);
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
function view(above){
 if(above){camera.position.set(mirrorX(STAIR.x1-.45)+.35,LEVEL+1.3,STAIR.z1+.35);camera.lookAt(mirrorX(STAIR.x1-.45),1.8,STAIR.z0+1.3);}
 else{camera.position.set(2, .6, 6.1);camera.lookAt(.4,2.2,5.9);}
 renderer.render(scene,camera);
}
document.querySelector('#above').onclick=()=>view(true);document.querySelector('#below').onclick=()=>view(false);
document.querySelector('#front').onclick=()=>{camera.position.set(1.5,4.8,4.3);camera.lookAt(.45,2.6,6.2);renderer.render(scene,camera);};view(true);
document.querySelector('#house').onclick=()=>{model.applyView(2,'walk');document.querySelector('#front').click();};
document.querySelector('#turn').onclick=()=>{camera.position.set(2.15,2.25,5.85);camera.lookAt(.55,1.65,4.5);renderer.render(scene,camera);};
</script>
